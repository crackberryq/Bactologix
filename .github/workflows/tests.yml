name: Software and adapter checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_HybAs
          ref: 780ee7086c15c49f2825800ec463327f009f14a6
          path: upstream-hybas
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_BaSIS
          ref: 14f161a1f252a712053892961edf2275469c8dab
          path: upstream-basis
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_BaSIS
          ref: 4fa218db3dfc73733267d36c225ebc0d8df50f27
          path: upstream-basis-followup
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_GeneScope
          ref: b47b16c286051ec841e7cdb593350004eb028475
          path: upstream-micpscope
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_HybAs
          ref: b13bd80efab8429a03b10a6bd2b7dac25b851e4d
          path: upstream-hybas-report
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_HybAs
          ref: 031ced7121b8ef06c4d97affac90a10699418bae
          path: upstream-hybas-review
      - name: Install software test dependencies
        run: python -m pip install . pytest build 'snakemake==9.6.2' 'numpy<3' 'biopython==1.86' 'openpyxl==3.1.5'
      - name: Test application and pinned workflow adapters
        env:
          BACTOLOGIX_HYBAS_REVIEW_SOURCE: ${{ github.workspace }}/upstream-hybas-review
          BACTOLOGIX_HYBAS_REPORT_SOURCE: ${{ github.workspace }}/upstream-hybas-report
          BACTOLOGIX_HYBAS_SOURCE: ${{ github.workspace }}/upstream-hybas
          BACTOLOGIX_MICPSCOPE_SOURCE: ${{ github.workspace }}/upstream-micpscope
          BACTOLOGIX_BASIS_SOURCE: ${{ github.workspace }}/upstream-basis
          BACTOLOGIX_BASIS_FOLLOWUP_SOURCE: ${{ github.workspace }}/upstream-basis-followup
        run: python -m pytest -q
      - name: Build and check installed package
        run: |
          python -m build
          python scripts/build_windows_bundle.py
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python -m bactologix.cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: packages-python-${{ matrix.python }}
          path: dist/*
  nearbeta-contracts:
    name: Near-beta pipeline contract (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: hybas
            repository: crackberryq/Bactomics_HybAs
            commit: 5db662262962bc822f2fe501234d15b882d5b042
          - tool: basis
            repository: crackberryq/Bactomics_BaSIS
            commit: 7c293d36a633a726424d544c6ffc39824537ebe4
          - tool: micpscope
            repository: crackberryq/Bactomics_GeneScope
            commit: 28bf38c44eb07fe8e4865f67d59ef6b4028f51dc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: nearbeta-pipeline
      - name: Install application and contract-test dependencies
        run: python -m pip install . pytest 'snakemake==9.6.2' 'biopython==1.86'
      - name: Check the exact pipeline adapter and saved-report renderer
        env:
          BACTOLOGIX_NEARBETA_TOOL: ${{ matrix.tool }}
          BACTOLOGIX_NEARBETA_SOURCE: ${{ github.workspace }}/nearbeta-pipeline
        run: |
          case "$BACTOLOGIX_NEARBETA_TOOL" in
            hybas) export BACTOLOGIX_HYBAS_REPORT_SOURCE="$BACTOLOGIX_NEARBETA_SOURCE" ;;
            basis) export BACTOLOGIX_BASIS_SOURCE="$BACTOLOGIX_NEARBETA_SOURCE" ;;
            micpscope) export BACTOLOGIX_MICPSCOPE_SOURCE="$BACTOLOGIX_NEARBETA_SOURCE" ;;
            *) exit 1 ;;
          esac
          python -m pytest -q tests/test_nearbeta_contracts.py tests/test_report_refresh.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crackberryq/Bactomics_HybAs
          ref: 780ee7086c15c49f2825800ec463327f009f14a6
          path: upstream-hybas
      - name: Isolate browser test Python and application launcher
        run: |
          python -m pip install virtualenv
          python -m virtualenv /tmp/bactologix-browser-env
          echo "/tmp/bactologix-browser-env/bin" >> "$GITHUB_PATH"
      - run: python -m pip install . pytest 'playwright==1.64.1'
      - name: Real browser to Streamlit checks
        env:
          BACTOLOGIX_BROWSER_TESTS: '1'
          BACTOLOGIX_UPDATE_CHECKS: '0'
          BACTOLOGIX_UI_PREVIEWS: ui-previews
          BACTOLOGIX_HYBAS_SOURCE: ${{ github.workspace }}/upstream-hybas
        run: |
          python -m pytest -q tests/test_browser.py::test_reference_starter_default_edit_restore_and_build
          python -m pytest -q tests/test_browser.py tests/test_browser_isolate.py tests/test_browser_adviser.py tests/test_browser_notifications.py tests/test_browser_methods_flow.py tests/test_browser_output_inventory.py tests/test_browser_swap.py tests/test_browser_restore.py -k 'not test_reference_starter_default_edit_restore_and_build'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: ui-previews/*.png
  environment-deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: bactologix-ci
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
      - run: python -m pip install . pytest 'snakemake==9.6.2'
      - name: Install and check a real sample-free environment
        env:
          BACTOLOGIX_ENVIRONMENT_TESTS: '1'
        run: python -m pytest -q tests/test_environment_deployment.py
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows launcher, installer rendering and browser ownership
        shell: powershell
        run: ./tests/windows_desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-preview
          path: windows-setup-*.png
  windows-installer:
    name: Build and check single-file Windows installer
    needs: [tests]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: packages-python-3.11
          path: dist
      - name: Compile reviewed Windows setup executable
        shell: powershell
        run: |
          python scripts/build_windows_executable.py --commit $env:GITHUB_SHA --output dist
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
      - name: Verify native executable without installing software
        shell: powershell
        run: ./tests/windows_executable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-package
          if-no-files-found: error
          path: |
            dist/Bactologix*-Setup.exe
            dist/Bactologix*-Setup.build.json
            dist/Bactologix*-Windows.zip
  publish:
    name: Publish checked application release
    needs: [tests, nearbeta-contracts, browser, environment-deployment, windows-desktop, windows-installer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bactologix-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: packages-python-3.11
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-package
          path: dist
      - name: Install the tested wheel
        run: python -m pip install dist/*.whl
      - name: Upload, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py





